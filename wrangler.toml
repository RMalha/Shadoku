# Cloudflare Pages: the Vite build (dist/) is the site, functions/ is the sign-in backend.
# Deploy:  npm run deploy        Local, with the backend:  npm run dev:cf   (reads .dev.vars)
name = "shadoku"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# Unique codenames + the account record (created with: npx wrangler kv namespace create SHADOKU_KV).
# Without this binding the site still signs people in; codenames are then just not reserved.
[[kv_namespaces]]
binding = "SHADOKU_KV"
id = "5dada60c1d764a75bd966fb67378b04b"

# The Syndicate ranking and the community puzzles (functions/_lib/db.js; tables are created on first use).
# Created with: npx wrangler d1 create shadoku. Without this binding those endpoints answer 503 and the pages say the feature is unavailable.
# Locally, wrangler pages dev uses its own local copy of this database (tables are created on first use there too).
# The Android app's wallet (functions/api/app, functions/_lib/app) keeps its tables in the same database, but they come from
# migrations/ and are NOT created on first use:  npx wrangler d1 migrations apply shadoku --local | --remote
# Until they are applied, /api/app/* answers 503 "schema"; the site is not affected.
[[d1_databases]]
binding = "SHADOKU_DB"
database_name = "shadoku"
database_id = "256df518-c797-4a52-8683-3bf3b19d9220"
migrations_dir = "migrations"

# ───────────── the app's real verifiers: Google Play, AdMob, Play Integrity (functions/_lib/app/verifiers.js; architecture 4.21) ─────────────
# Nothing here is set by default, and without it the endpoints answer 503 and grant nothing (fail closed). Each switches on by itself.
# Where each value comes from, step by step: functions/CLAUDE.md "Secrets and settings of the app's verifiers".
#
# SECRET (its value is never written in this file, in the repository or in a log: it is only named here):
#   PLAY_SERVICE_ACCOUNT   the JSON key file of the Google Cloud service account that may read and finish purchases in Play
#                          Console and decode Play Integrity tokens. Switches on /api/app/billing/verify, the nightly
#                          voided-purchases check, /api/app/integrity and the fallback of /api/app/ads/claim. From PowerShell:
#       Get-Content "$env:USERPROFILE\.shadoku\play-service-account.json" -Raw | npx wrangler pages secret put PLAY_SERVICE_ACCOUNT --project-name shadoku
#   (already there: CRON_SECRET, which the nightly check shares with the rest of /api/cron/retention)
#
# SETTINGS (not secret: an ad unit id ships inside the app, the others are names). Uncomment and fill in, then deploy:
#   ADMOB_AD_UNITS       our rewarded ad units, comma-separated. Switches on /api/app/ads/ssv: a callback Google signed for
#                        any other ad unit is refused.
#   PLAY_RTDN_EMAIL      the service account the Pub/Sub push subscription signs as. Switches on /api/app/billing/rtdn.
#   PLAY_SUBSCRIPTIONS   product ids sold as subscriptions, comma-separated. Empty: every product is a one-time product.
[vars]
ADMOB_AD_UNITS = "ca-app-pub-9051737903532615/7921679354,ca-app-pub-9051737903532615/7935342980,ca-app-pub-9051737903532615/3772736695"
PLAY_RTDN_EMAIL = "shadokuservice@heroic-vial-513417-k3.iam.gserviceaccount.com"
PLAY_SUBSCRIPTIONS = ""

# ───────────── the TEST server: every Pages preview deployment (architecture 4.17) ─────────────
# Every deployment that is not the production branch ("main") is a preview, e.g. `--branch test` -> https://test.shadoku.pages.dev.
# Previews get their OWN database and KV namespace, so fake purchases and the tester kit never touch a real account or the
# production economy. Pages allows only [env.preview] and [env.production]; the top level above stays production (and local dev).
# Bindings and vars are NOT inherited: everything a preview needs is listed again here. Created once by the author with:
#   npx wrangler d1 create shadoku-test                      -> put its database_id below
#   npx wrangler kv namespace create SHADOKU_KV_TEST         -> put its id below
#   npx wrangler d1 migrations apply shadoku-test --remote --env preview
#   npx wrangler pages secret put SESSION_SECRET --project-name shadoku --env preview   (a NEW random value, not production's)
# DEV_BILLING / DEV_ADS / DEV_KIT work only on localhost and *.pages.dev preview addresses (functions/_lib/app/verifiers.js devHost).
# There they come before the real verifiers, so the test server needs none of the settings above.
[[env.preview.kv_namespaces]]
binding = "SHADOKU_KV"
id = "1173ccf9f5fa422a9801c063c5226496"

[[env.preview.d1_databases]]
binding = "SHADOKU_DB"
database_name = "shadoku-test"
database_id = "349d5115-2dae-49dd-92d0-cbd0c2e3195d"
migrations_dir = "migrations"

[env.preview.vars]
DEV_BILLING = "1"
DEV_ADS = "1"
DEV_KIT = "1"
